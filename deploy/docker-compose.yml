# Local CareFlow environment. Usage (from repo root):
#   docker compose -f deploy/docker-compose.yml up -d --build
# Credentials here are for local development only.
name: careflow

x-aws-local: &aws-local
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  Aws__ServiceUrl: http://localstack:4566
  Aws__EventsTopicArn: arn:aws:sns:us-east-1:000000000000:careflow-events
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317

services:
  localstack:
    image: localstack/localstack:4.9
    environment:
      SERVICES: s3,sns,sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Single-node replica set: the transactional outbox needs multi-document transactions, which standalone mongod lacks.
  # Clients connect with directConnection=true, so the member name (localhost) never has to resolve from other hosts.
  mongo:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first run; healthy only once this node is a writable primary.
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) } if (!db.hello().isWritablePrimary) { quit(1) }"]
      interval: 5s
      timeout: 5s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Tokens are issued for the browser-facing URL; containers fetch keys over the Docker network.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/careflow-realm.json:/opt/keycloak/data/import/careflow-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 3s
      retries: 40

  jaeger:
    image: jaegertracing/jaeger:2.10.0
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC

  ingestion-api:
    build:
      context: ..
      dockerfile: src/Ingestion/CareFlow.Ingestion.Api/Dockerfile
    image: careflow/ingestion-api:local
    environment:
      <<: *aws-local
      ASPNETCORE_ENVIRONMENT: Production
      Swagger__Enabled: "true"
      Auth__Authority: http://localhost:8080/realms/careflow
      Auth__MetadataAddress: http://keycloak:8080/realms/careflow/.well-known/openid-configuration
      Auth__RequireHttpsMetadata: "false"
      Aws__RawBucket: careflow-raw
      Mongo__ConnectionString: mongodb://mongo:27017/?directConnection=true
      Consumers__ParseResults__QueueUrl: http://localstack:4566/000000000000/ingestion-parse-results
      Consumers__ParseResults__DeadLetterQueueUrl: http://localstack:4566/000000000000/ingestion-parse-results-dlq
    ports:
      - "5080:8080"
    depends_on:
      localstack: { condition: service_healthy }
      mongo: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      jaeger: { condition: service_started }

  parser-worker:
    build:
      context: ..
      dockerfile: src/Parser/CareFlow.Parser.Worker/Dockerfile
    image: careflow/parser-worker:local
    environment:
      <<: *aws-local
      ASPNETCORE_ENVIRONMENT: Production
      Aws__ResultsBucket: careflow-parsed
      Parser__SourceBucket: careflow-raw
      Mongo__ConnectionString: mongodb://mongo:27017/?directConnection=true
      Consumers__FileReceived__QueueUrl: http://localstack:4566/000000000000/parser-file-received
      Consumers__FileReceived__DeadLetterQueueUrl: http://localstack:4566/000000000000/parser-file-received-dlq
    ports:
      - "5081:8080" # health probes only
    depends_on:
      localstack: { condition: service_healthy }
      mongo: { condition: service_healthy }
      jaeger: { condition: service_started }

volumes:
  mongo-data:
