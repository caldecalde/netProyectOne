name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release

      - name: Unit & architecture tests
        run: >
          dotnet test --no-build -c Release
          --filter "FullyQualifiedName!~IntegrationTests"
          --logger trx --results-directory TestResults

      # GitHub's Windows runners cannot run Linux containers, so Testcontainers suites run on Linux only.
      - name: Integration tests (Testcontainers - MongoDB + LocalStack)
        if: runner.os == 'Linux'
        run: >
          dotnet test --no-build -c Release
          --filter "FullyQualifiedName~IntegrationTests"
          --logger trx --results-directory TestResults

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults

  sonar:
    name: SonarCloud quality gate
    # Enabled once the repository variable SONAR_PROJECT_KEY and secret SONAR_TOKEN are configured.
    if: ${{ vars.SONAR_PROJECT_KEY != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history for blame / new-code detection
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet tool install --global dotnet-sonarscanner
      - name: Analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"${{ vars.SONAR_PROJECT_KEY }}" /o:"${{ vars.SONAR_ORGANIZATION }}" \
            /d:sonar.host.url="https://sonarcloud.io" /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.exclusions="samples/**,deploy/**"
          dotnet build -c Release
          dotnet test --no-build -c Release --collect:"XPlat Code Coverage;Format=opencover"
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  e2e:
    name: End-to-end (docker compose + smoke test)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start stack
        run: docker compose -f deploy/docker-compose.yml up -d --build --wait --wait-timeout 300
      - name: Smoke test with real Keycloak tokens (upload -> parse -> status)
        run: bash scripts/smoke-test.sh
      - name: Container logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color
      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
